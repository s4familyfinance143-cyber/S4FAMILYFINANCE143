name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build PWA
        working-directory: frontend
        env:
          VITE_API_BASE: "https://app.s4businessthinking.com/api/v1"
          VITE_GOOGLE_CLIENT_ID: "337941876187-bolk7n1dbmbiclqf1kqr2g6t2tq92bnc.apps.googleusercontent.com"
        run: |
          npm ci
          npm run i18n:check
          npm run build:pwa
      - name: Package PWA release zip
        run: |
          cp deploy/release/PWA-INSTALL.txt frontend/dist/PWA-INSTALL.txt
          cd frontend/dist
          zip -r ../../S4-Family-Finance-143-PWA.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: pwa-dist
          path: |
            frontend/dist
            S4-Family-Finance-143-PWA.zip
            deploy/release/PWA-INSTALL.txt

  build-android-apk:
    runs-on: ubuntu-latest
    needs: build-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pwa-dist
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # android-actions/setup-android@v3 defaults to `sdkmanager tools`, a
      # package Google retired from the SDK repository (replaced by
      # cmdline-tools) -- it now fails outright with "Failed to find package
      # 'tools'" before our own steps even run. ubuntu-latest GitHub runners
      # already ship a preinstalled Android SDK (ANDROID_HOME/ANDROID_SDK_ROOT
      # set, platforms + build-tools present), so this step was also
      # redundant. Just ensure the specific platform/build-tools this app
      # needs are present via the preinstalled sdkmanager instead.
      - name: Ensure required Android SDK packages
        run: |
          # frontend/android/variables.gradle pins compileSdkVersion/targetSdkVersion = 35.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Sync Capacitor Android
        working-directory: frontend
        env:
          CAPACITOR: "true"
          VITE_API_BASE: "https://app.s4businessthinking.com/api/v1"
          VITE_GOOGLE_CLIENT_ID: "337941876187-bolk7n1dbmbiclqf1kqr2g6t2tq92bnc.apps.googleusercontent.com"
        run: |
          npm ci
          npm run generate:icons
          npx vite build
          npx cap sync android
      - name: Build release APK (CI-signed)
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          # CI distribution uses the Android debug keystore so assembleRelease
          # works without a private Play Store keystore secret.
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=S4 CI, OU=S4, O=S4, L=Dhaka, ST=Dhaka, C=BD"
          fi
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
      - name: Rename APK
        run: |
          cp frontend/android/app/build/outputs/apk/release/app-release.apk S4-Family-Finance-143.apk \
            || cp frontend/android/app/build/outputs/apk/release/*.apk S4-Family-Finance-143.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: S4-Family-Finance-143.apk

  build-windows-exe:
    runs-on: windows-latest
    needs: build-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pwa-dist
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build Tauri Windows installer (VPS API)
        shell: pwsh
        env:
          VITE_API_BASE: "https://app.s4businessthinking.com/api/v1"
          VITE_GOOGLE_CLIENT_ID: "337941876187-bolk7n1dbmbiclqf1kqr2g6t2tq92bnc.apps.googleusercontent.com"
        run: ./deploy/scripts/build_tauri_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            S4-Family-Finance-143-Setup.exe
            deploy/release/WINDOWS-INSTALL.txt

  github-release:
    runs-on: ubuntu-latest
    needs: [build-pwa, build-android-apk, build-windows-exe]
    if: always() && needs.build-pwa.result == 'success' && needs.build-android-apk.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pwa-dist
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-exe
          path: release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: S4 Family Finance 143 ${{ github.ref_name }}
          files: |
            release-assets/S4-Family-Finance-143-PWA.zip
            release-assets/PWA-INSTALL.txt
            release-assets/S4-Family-Finance-143.apk
            release-assets/S4-Family-Finance-143-Setup.exe
            release-assets/WINDOWS-INSTALL.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
