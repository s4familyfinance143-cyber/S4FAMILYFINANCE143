name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build PWA
        working-directory: frontend
        run: |
          npm ci
          npm run i18n:check
          npm run build:pwa
      - name: Package PWA release zip
        run: |
          cp deploy/release/PWA-INSTALL.txt frontend/dist/PWA-INSTALL.txt
          cd frontend/dist
          zip -r ../../S4-Family-Finance-143-PWA.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: pwa-dist
          path: |
            frontend/dist
            S4-Family-Finance-143-PWA.zip
            deploy/release/PWA-INSTALL.txt

  build-android-apk:
    runs-on: ubuntu-latest
    needs: build-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pwa-dist
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Sync Capacitor Android
        working-directory: frontend
        run: |
          npm ci
          npm run generate:icons
          CAPACITOR=true npx vite build
          npx cap sync android
      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk S4-Family-Finance-143.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: S4-Family-Finance-143.apk

  build-windows-exe:
    runs-on: windows-latest
    needs: build-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pwa-dist
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build Tauri Windows installer (Firebase desktop — no backend)
        shell: pwsh
        run: ./deploy/scripts/build_tauri_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            S4-Family-Finance-143-Setup.exe
            deploy/release/WINDOWS-INSTALL.txt

  firebase-hosting:
    runs-on: ubuntu-latest
    needs: build-pwa
    continue-on-error: true
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pwa-dist
          path: frontend/dist
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN not set — skip hosting deploy"
            exit 0
          fi
          npm install -g firebase-tools
          firebase deploy --only hosting --project s4-family-finance --token "$FIREBASE_TOKEN"

  github-release:
    runs-on: ubuntu-latest
    needs: [build-pwa, build-android-apk, build-windows-exe]
    if: always() && needs.build-pwa.result == 'success' && needs.build-android-apk.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pwa-dist
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-exe
          path: release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: S4 Family Finance 143 ${{ github.ref_name }}
          files: |
            release-assets/S4-Family-Finance-143-PWA.zip
            release-assets/PWA-INSTALL.txt
            release-assets/S4-Family-Finance-143.apk
            release-assets/S4-Family-Finance-143-Setup.exe
            release-assets/WINDOWS-INSTALL.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
