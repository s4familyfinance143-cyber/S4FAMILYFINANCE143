[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q
markers =
    integration: PostgreSQL / service integration tests (CI job with Postgres container)
filterwarnings =
    ignore::DeprecationWarning

# Coverage: report always. fail-under is an anti-regression floor (raise toward 80% over time).
# Architecture target remains 80%+; measured unit coverage is 38%, so keep one point of headroom.
[coverage:run]
source = app
branch = False
omit =
    */alembic/*
    */tests/*

[coverage:report]
precision = 1
show_missing = false
skip_covered = true
# Floor intentionally trails the measured 38% suite while coverage grows.
fail_under = 37
