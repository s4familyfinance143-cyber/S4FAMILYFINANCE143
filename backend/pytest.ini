[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q
markers =
    integration: PostgreSQL / service integration tests (CI job with Postgres container)
filterwarnings =
    ignore::DeprecationWarning

# Coverage: report always. fail-under is an anti-regression floor (raise toward 80% over time).
# Architecture target remains 80%+; current baseline ~36% unit coverage.
[coverage:run]
source = app
branch = False
omit =
    */alembic/*
    */tests/*

[coverage:report]
precision = 1
show_missing = false
skip_covered = true
# Soft floor so CI stays green while coverage grows; do not jump to 80 overnight.
fail_under = 30
