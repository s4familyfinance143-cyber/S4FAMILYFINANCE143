[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q
markers =
    integration: PostgreSQL / service integration tests (CI job with Postgres container)
filterwarnings =
    ignore::DeprecationWarning

# Coverage: report always. fail-under is an anti-regression floor (raise toward 80% over time).
# Architecture target remains 80%+; keep two points below measured unit coverage.
[coverage:run]
source = app
branch = False
omit =
    */alembic/*
    */tests/*

[coverage:report]
precision = 1
show_missing = false
skip_covered = true
# Measured at 81.0% (post-batch14-16); floor intentionally trails by two percentage points.
# Architecture target remains 80%+ (raise fail_under toward 80% as coverage grows).
fail_under = 79.0
