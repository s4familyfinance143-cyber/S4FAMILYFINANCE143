# Prometheus scrape config — S4 Family Finance
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: s4-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: s4-backend

  # node-exporter always runs in production (docker-compose.monitoring.prod.yml
  # has no profile gate on it), so this must stay active for HighDiskUsage /
  # HighMemoryUsage (alerts.yml) to ever fire there. It was previously
  # commented out here with instructions that only matched the *local* dev
  # compose's opt-in `--profile host-metrics` — production ran node-exporter
  # but Prometheus never scraped it, so those two alerts could never fire.
  # Local dev: harmless if node-exporter isn't started (--profile host-metrics
  # to opt in) — this target just shows as down, no alert rule depends on it.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: host

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis

  - job_name: flower
    metrics_path: /metrics
    static_configs:
      - targets: ["flower:5555"]
        labels:
          service: celery-flower
