# Production / VPS stack — same architecture services as root docker-compose.yml
# Usage (from deploy/docker):
#   cp .env.production.example .env.production
#   docker compose --env-file .env.production -f docker-compose.production.yml up -d --build
#
# Services: postgres, redis, minio, backend, celery_worker, celery_beat, flower, nginx(+frontend)

services:
  postgres:
    image: postgres:16-alpine
    container_name: s4-family-finance-postgres
    restart: unless-stopped
    # Slow query log: statements ≥ 500ms → docker logs s4-family-finance-postgres
    command:
      [
        "postgres",
        "-c",
        "log_min_duration_statement=500",
        "-c",
        "log_checkpoints=on",
        "-c",
        "log_lock_waits=on",
      ]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-s4_family_finance_production}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before production deploy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: s4-family-finance-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD before production deploy}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD before production deploy}"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: s4-family-finance-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER before production deploy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD before production deploy}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: s4-family-finance-mailpit
    restart: unless-stopped
    profiles: ["staging"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: s4-family-finance-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL before production deploy}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY before production deploy}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_RSA_KEYS_MOUNTED: ${JWT_RSA_KEYS_MOUNTED:-false}
      ENABLE_RECURRING_WORKER: ${ENABLE_RECURRING_WORKER:-false}
      ENABLE_AUTO_BACKUP_WORKER: ${ENABLE_AUTO_BACKUP_WORKER:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://example.com"]}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://example.com}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      CELERY_ENABLED: ${CELERY_ENABLED:-true}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-s4-family-finance}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      DOCUMENT_VAULT_BACKEND: ${DOCUMENT_VAULT_BACKEND:-s3}
      NOTIFICATION_FCM_ENABLED: ${NOTIFICATION_FCM_ENABLED:-false}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-false}
      AUTH_EMAIL_ENABLED: ${AUTH_EMAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  celery_worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: s4-family-finance-celery-worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL before production deploy}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY before production deploy}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_RSA_KEYS_MOUNTED: ${JWT_RSA_KEYS_MOUNTED:-false}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      CELERY_ENABLED: "true"
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-s4-family-finance}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      DOCUMENT_VAULT_BACKEND: ${DOCUMENT_VAULT_BACKEND:-s3}
      ENABLE_RECURRING_WORKER: "false"
      ENABLE_AUTO_BACKUP_WORKER: "false"
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app.celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=2",
      ]

  celery_beat:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: s4-family-finance-celery-beat
    restart: unless-stopped
    depends_on:
      celery_worker:
        condition: service_started
    environment:
      ENVIRONMENT: production
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL before production deploy}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY before production deploy}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_RSA_KEYS_MOUNTED: ${JWT_RSA_KEYS_MOUNTED:-false}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      CELERY_ENABLED: "true"
      ENABLE_RECURRING_WORKER: "false"
      ENABLE_AUTO_BACKUP_WORKER: "false"
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app.celery_app",
        "beat",
        "--loglevel=info",
      ]

  flower:
    image: mher/flower:2.0
    container_name: s4-family-finance-flower
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    environment:
      CELERY_BROKER_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
    ports:
      - "127.0.0.1:5555:5555"

  # Architecture: nginx reverse proxy + SSL (SPA static baked into image)
  # Service name `nginx` (architecture). Alias `frontend` kept for older deploy scripts.
  nginx:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api/v1}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
        VITE_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    container_name: s4-family-finance-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../nginx/certs:/etc/nginx/certs:ro

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api/v1}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
        VITE_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    container_name: s4-family-finance-frontend
    restart: unless-stopped
    profiles: ["legacy-frontend-name"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
