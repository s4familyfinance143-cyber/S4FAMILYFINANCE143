services:
  s4-postgres:
    image: postgres:17
    container_name: s4-family-finance-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: s4_user
      POSTGRES_PASSWORD: s4_cutover_local_2026
      POSTGRES_DB: s4_family_finance
    volumes:
      - s4_pg_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s4_user -d s4_family_finance"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  s4_pg_data:
