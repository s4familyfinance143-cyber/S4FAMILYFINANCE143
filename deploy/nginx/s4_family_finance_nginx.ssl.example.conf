# Production TLS termination + gzip + rate limit + upstream LB
# Replace your-domain.example and certificate paths before use.

upstream s4_backend {
    least_conn;
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    # server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=s4_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=s4_auth_limit:10m rate=5r/s;

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

server {
    listen 80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Architecture: HSTS (HTTPS only)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Auth endpoints — stricter rate limit (must match the base HTTP config;
    # this regex location was missing here, silently dropping every request
    # to /api/.../auth/... down to the general 30r/s limit instead of 5r/s).
    location ~ ^/api/(v1/|v2/)?auth/ {
        limit_req zone=s4_auth_limit burst=10 nodelay;
        proxy_pass http://s4_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=s4_api_limit burst=60 nodelay;
        # Trailing-slash prefix on BOTH the location and proxy_pass URI so
        # /api/... is preserved when forwarded (the backend's routes live at
        # /api/v1/... and /api/v2/...) — this previously pointed at
        # http://s4_backend/ (no /api/ path), which strips the /api/ prefix
        # and would 404 every API call routed through this HTTPS config.
        proxy_pass http://s4_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
