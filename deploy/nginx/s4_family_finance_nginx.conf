# S4 Family Finance — production edge gateway
# Features: upstream LB, gzip, rate limiting, static SPA, API proxy

upstream s4_backend {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=30s;
    # Scale-out example (uncomment additional replicas):
    # server backend2:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=s4_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=s4_auth_limit:10m rate=5r/s;

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff2;

server {
    listen 80;
    server_name _;

    # Architecture: prefer HTTPS in production — uncomment redirect when TLS certs ready:
    # return 301 https://$host$request_uri;
    # Also enable s4_family_finance_nginx.ssl.example.conf (HSTS + Let's Encrypt).

    client_max_body_size 20m;

    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA + hashed assets
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # Auth endpoints — stricter rate limit
    location ~ ^/api/(v1/|v2/)?auth/ {
        limit_req zone=s4_auth_limit burst=10 nodelay;
        proxy_pass http://s4_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Browser may call /api/v1 or /api/v2; preserve /api/... at the backend.
    location /api/ {
        limit_req zone=s4_api_limit burst=60 nodelay;
        proxy_pass http://s4_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# Grafana UI — enable after DNS for grafana.s4family.app points at this host.
# Requires monitoring overlay: deploy/monitoring/docker-compose.monitoring.prod.yml
server {
    listen 80;
    server_name grafana.s4family.app;

    location / {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
